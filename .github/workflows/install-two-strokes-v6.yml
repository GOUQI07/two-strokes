name: Install Two Strokes v6

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-two-strokes-v6.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-two-strokes-v6
  cancel-in-progress: true

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Restore and verify the original release ZIP
        shell: python
        run: |
          import base64
          import hashlib
          from pathlib import Path

          workflow = Path(".github/workflows/install-two-strokes-v6.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          encoded = "".join(line[2:] for line in lines if line.startswith("#|"))
          data = base64.b85decode(encoded)
          if hashlib.sha256(data).hexdigest() != "77f15a6dd5f5fb4892ac30752125864c455e45d8e5a196affa26814ba9ef6e3d":
              raise SystemExit("The update text is incomplete. Copy and paste it again.")
          Path("two-stroke-studio-drawfix.zip").write_bytes(data)

      - name: Commit the verified ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          package=two-stroke-studio-drawfix.zip
          installer=.github/workflows/install-two-strokes-v6.yml
          git add -- "$package"
          if git diff --cached --quiet -- "$package"; then
            echo "v6 is already installed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install Two Strokes v6" -- "$package"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            git fetch origin main
            if ! git diff --quiet HEAD^ FETCH_HEAD -- "$installer" "$package"; then
              echo "The release files changed on main. Run the installer again on main."
              exit 1
            fi
            git rebase FETCH_HEAD
          done
          exit 1

